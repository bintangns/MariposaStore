; Dipakai Nixpacks (Railway) buat nge-override default php.ini.
; Default upload_max_filesize PHP cuma 2M, lebih kecil dari validasi upload
; bukti pembayaran di kode (max 5MB), jadi upload foto dari HP sering gagal
; duluan di level PHP sebelum sempat divalidasi Laravel.
upload_max_filesize = 10M
post_max_size = 12M
